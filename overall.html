    </style>
</head>

<div class="modal-overlay" id="driverGraphModal">

<script type="module">

import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAwRV2OuIhA-oyg295gIv5-4zfzO4qb9MY",
    authDomain: "alces-d505c.firebaseapp.com",
    projectId: "alces-d505c",
    storageBucket: "alces-d505c.firebasestorage.app",
    messagingSenderId: "318520073072",
    appId: "1:318520073072:web:53ab5c0033f60e96bbcdb5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUserEmail = "";
let myPersonalOc = "";
let isUserManagement = false; 
let cachedDzvaDocs = [];
let cachedArchiveDocs = [];
let ridiciMap = {};
let matrixGlobal = {}; 
let aktivniZobrazeneMesice = []; 
let modalChartInstance = null;
let currentModalOc = "";
let currentModalEmail = "";
let isCompanyMode = false;

let topIncreaserOc = "";
let topIncreaserEmail = "";
let topDecreaserOc = "";
let topDecreaserEmail = "";

const sledovaneMesice = [
    "2025-04", "2025-05", "2025-06", "2025-07", "2025-08", "2025-09",
    "2025-10", "2025-11", "2025-12", "2026-01", "2026-02", "2026-03",
    "2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09",
    "2026-10", "2026-11", "2026-12", "2027-01"
];

const d = new Date();
const aktualniMesicKlic = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

const kvartalMap = {
    "2025-04": "q2-25", "2025-05": "q2-25", "2025-06": "q2-25",
    "2025-07": "q3-25", "2025-08": "q3-25", "2025-09": "q3-25",
    "2025-10": "q4-25", "2025-11": "q4-25", "2025-12": "q4-25",
    "2026-01": "q1-26", "2026-02": "q1-26", "2026-03": "q1-26",
    "2026-04": "q2-26", "2026-05": "q2-26", "2026-06": "q2-26", 
    "2026-07": "q3-26", "2026-08": "q3-26", "2026-09": "q3-26",
    "2026-10": "q4-26", "2026-11": "q4-26", "2026-12": "q4-26",
    "2027-01": "q1-27"
};
const aktualniKvartalId = kvartalMap[aktualniMesicKlic] || "";

const loadingCell = document.getElementById("loadingCell");
if (loadingCell) loadingCell.colSpan = sledovaneMesice.length + 2;

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUserEmail = user.email.toLowerCase();
        ZvyrazniHlavičku();
        await buildOverallDashboard();
    } else {
        window.location.href = "login.html";
    }
});

window.addEventListener("DOMContentLoaded", () => {
    const modalOverlay = document.getElementById("driverGraphModal");
    const closeBtn = document.getElementById("modalCloseBtn");

    closeBtn.addEventListener("click", closeModal);
    
    modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) {
            closeModal();
        }
    });

    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" || e.key === "Esc") {
            closeModal();
        }
    });

    document.getElementById("modalPeriodSelect").addEventListener("change", renderModalChart);

    document.getElementById("btnCompanyGraph").addEventListener("click", () => {
        openCompanyModal();
    });

    document.getElementById("btnJumpIncrease").addEventListener("click", () => {
        if (topIncreaserOc) {
            openDriverModal(topIncreaserOc, topIncreaserEmail);
        }
    });

    document.getElementById("btnJumpDecrease").addEventListener("click", () => {
        if (topDecreaserOc) {
            openDriverModal(topDecreaserOc, topDecreaserEmail);
        }
    });
});

function closeModal() {
    document.getElementById("driverGraphModal").classList.remove("active");
}

function ZvyrazniHlavičku() {
    if (aktualniKvartalId) {
        const thKvartal = document.getElementById(aktualniKvartalId);
        if (thKvartal) thKvartal.classList.add("current-highlight");
    }
    const thMesice = document.querySelectorAll("#monthsHeaderRow th");
    const zjednodusenyFormat = `${d.getMonth() + 1}/${String(d.getFullYear()).slice(-2)}`;
    thMesice.forEach(th => {
        if (th.innerText.trim() === zjednodusenyFormat) {
            th.classList.add("current-highlight");
        }
    });
}

function ziskejBarvuSkaly(aktualniKm, limit) {
    if (aktualniKm >= limit) return "rgba(0, 184, 79, 0.6)"; 
    const pomer = aktualniKm / limit; 
    let r, g, b;
    if (pomer < 0.5) {
        r = 150; g = Math.round(pomer * 2 * 120); b = 30;
    } else {
        r = Math.round(150 - (pomer - 0.5) * 2 * 110); g = 130; b = 30;
    }
    return `rgba(${r}, ${g}, ${b}, 0.35)`;
}

function smartSortOc(a, b) {
    const cleanA = a.replace("Z", "");
    const cleanB = b.replace("Z", "");
    return parseInt(cleanA || 999999) - parseInt(cleanB || 999999);
}

function ziskejMesicKlic(data, docId = "") {
    if (docId && docId.includes("_")) {
        const parts = docId.split("_");
        if (parts[1] && parts[1].includes("-")) return parts[1].trim();
    }
    if (data.archiveMonth) return data.archiveMonth;
    if (data.mesic && data.rok) {
        const m = String(data.mesic).padStart(2, '0');
        return `${data.rok}-${m}`;
    }
    if (data.dateText && typeof data.dateText === "string") {
        const clean = data.dateText.replace(/\s+/g, '');
        const parts = clean.split('.');
        if (parts.length >= 3) {
            const mon = parseInt(parts[1], 10);
            const yr = parseInt(parts[2], 10);
            if (!isNaN(mon) && !isNaN(yr) && yr > 2000) {
                return `${yr}-${String(mon).padStart(2, '0')}`;
            }
        }
    }
    const dVal = data.datum || data.createdAt || data.date;
    if (dVal) {
        try {
            let cd = dVal.toDate ? dVal.toDate() : new Date(dVal);
            if (!isNaN(cd.getTime()) && cd.getFullYear() > 2000) {
                return `${cd.getFullYear()}-${String(cd.getMonth() + 1).padStart(2, '0')}`;
            }
        } catch(e) {}
    }
    return "";
}

function parseKmValue(data) {
    let zaklad = data.najetoKm ?? data.km ?? data.kilometry ?? 0;
    if (typeof zaklad === "object") zaklad = zaklad.najetoKm || zaklad.celkem || 0;
    if (typeof zaklad === "string") zaklad = zaklad.replace(",", ".").replace(/[^\d.]/g, "");
    
    let bonus = data.bonusKm ?? data.bonus ?? 0;
    if (typeof bonus === "string") bonus = bonus.replace(",", ".").replace(/[^\d.]/g, "");

    const pZaklad = parseFloat(zaklad) || 0;
    const pBonus = parseFloat(bonus) || 0;

    return pZaklad + pBonus;
}

function parseDocDate(data, docId = "") {
    const raw = data.datum || data.createdAt || data.dateText || data.date;
    
    if (raw) {
        if (typeof raw.toDate === "function") return raw.toDate();
        if (raw instanceof Date && !isNaN(raw.getTime())) return raw;
        
        if (typeof raw === "string" && raw.includes(".")) {
            const parts = raw.split(".").map(p => p.trim());
            if (parts.length >= 3) {
                const day = parseInt(parts[0], 10);
                const mon = parseInt(parts[1], 10) - 1;
                const yr = parseInt(parts[2], 10);
                if (!isNaN(day) && !isNaN(mon) && !isNaN(yr)) return new Date(yr, mon, day);
            }
        }

        const parsed = new Date(raw);
        if (!isNaN(parsed.getTime()) && parsed.getFullYear() > 2000) return parsed;
    }

    const mKlic = ziskejMesicKlic(data, docId);
    if (mKlic && mKlic.includes("-")) {
        const parts = mKlic.split("-");
        const yr = parseInt(parts[0], 10);
        const mon = parseInt(parts[1], 10) - 1;
        if (!isNaN(yr) && !isNaN(mon)) {
            return new Date(yr, mon, 15);
        }
    }

    return null;
}

async function buildOverallDashboard() {
    try {
        const usersSnapshot = await getDocs(collection(db, "users"));
        ridiciMap = {}; 
        let dočasnýSeznamCisel = [];

        usersSnapshot.forEach(uDoc => {
            const uData = uDoc.data();
            const emailKey = uDoc.id.toLowerCase();
            const oc = String(uData.oc || uData.osobniCislo || "").toUpperCase().trim();
            const rank = String(uData.rank || "ridic").toLowerCase().trim();
            const rName = String(uData.rankName || "").trim();
            
            if (oc) {
                ridiciMap[emailKey] = { oc: oc, rank: rank, rankName: rName, email: emailKey };
                if (!dočasnýSeznamCisel.includes(oc)) {
                    dočasnýSeznamCisel.push(oc);
                }
            }

            if (emailKey === currentUserEmail) {
                myPersonalOc = oc;
                if (rank === "majitel" || rank === "management" || rank.includes("reditel") || rank === "dispecer" || rank.includes("manager")) {
                    isUserManagement = true;
                }
            }
        });

        if (isUserManagement) {
            const btnComp = document.getElementById("btnCompanyGraph");
            if (btnComp) btnComp.style.display = "flex";
        }

        function ziskejUzivatelData(oc) {
            for (const [em, info] of Object.entries(ridiciMap)) {
                if (info.oc === oc) return info;
            }
            return { rank: "ridic", rankName: "", email: "" };
        }

        let majitele = [];
        let majitelePolovicni = [];
        let management = [];
        let provozniReditele = [];
        let dispeceri = [];
        let manageri = [];
        let zaslouziliRidici = [];
        let ridici = [];
        let zkusebniRidici = [];

        dočasnýSeznamCisel.forEach(oc => {
            const uData = ziskejUzivatelData(oc);
            const r = uData.rank;
            const rn = uData.rankName.toLowerCase();

            if (r === "management" && (rn.includes("úvazek") || rn.includes("poloviční"))) {
                majitelePolovicni.push(oc);
            } else if (r === "majitel") {
                majitele.push(oc);
            } else if (r === "management") {
                management.push(oc);
            } else if (r === "provozni-reditel" || r === "provozni_reditel" || r.includes("reditel")) {
                provozniReditele.push(oc);
            } else if (r === "dispecer") {
                dispeceri.push(oc);
            } else if (r === "team-manager" || r === "team_manager" || r === "manager") {
                manageri.push(oc);
            } else if (r === "zasloužily-ridic" || r === "zaslouzily_ridic") {
                zaslouziliRidici.push(oc);
            } else if (r === "zkusebni-ridic" || r === "zkusebni_ridic" || r.includes("zkusebni")) {
                zkusebniRidici.push(oc);
            } else {
                ridici.push(oc);
            }
        });

        majitele.sort(smartSortOc);
        majitelePolovicni.sort(smartSortOc);
        management.sort(smartSortOc);
        provozniReditele.sort(smartSortOc);
        dispeceri.sort(smartSortOc);
        manageri.sort(smartSortOc);
        zaslouziliRidici.sort(smartSortOc);
        ridici.sort(smartSortOc);
        zkusebniRidici.sort(smartSortOc);

        const seznamOsobníchCiselSerazeny = [
            ...majitele,
            ...majitelePolovicni,
            ...management,
            ...provozniReditele,
            ...dispeceri,
            ...manageri,
            ...zaslouziliRidici, 
            ...ridici,
            ...zkusebniRidici
        ];

        matrixGlobal = {};
        let omluvenkyMatrix = {}; 

        const indexAktualnihoMesice = sledovaneMesice.indexOf(aktualniMesicKlic);
        const maxLimitIndex = indexAktualnihoMesice !== -1 ? indexAktualnihoMesice : sledovaneMesice.length - 1;
        const orezaneSledovaneMesice = sledovaneMesice.slice(0, maxLimitIndex + 1);

        seznamOsobníchCiselSerazeny.forEach(oc => {
            matrixGlobal[oc] = {};
            omluvenkyMatrix[oc] = {};
            orezaneSledovaneMesice.forEach(m => {
                matrixGlobal[oc][m] = { type: "empty", val: 0 };
                omluvenkyMatrix[oc][m] = false;
            });
        });

        const absencesSnapshot = await getDocs(collection(db, "absences"));
        absencesSnapshot.forEach(docSnap => {
            const data = docSnap.data();
            const email = String(data.userEmail || "").toLowerCase().trim();
            const rInfo = ridiciMap[email];

            if (rInfo && data.status === "schvaleno" && data.from) {
                const startMesic = data.from;
                const konecMesic = data.to || data.from; 
                const absenceType = String(data.type || "").trim(); // "Pauza" nebo "Omluvenka"
                
                orezaneSledovaneMesice.forEach(m => {
                    if (m >= startMesic && m <= konecMesic) {
                        if (omluvenkyMatrix[rInfo.oc]) {
                            omluvenkyMatrix[rInfo.oc][m] = absenceType;
                        }
                    }
                });
            }
        });

        cachedArchiveDocs = [];
        const archiveSnapshot = await getDocs(collection(db, "ridici_archivy"));
        archiveSnapshot.forEach(docSnap => {
            const docId = docSnap.id;
            const data = docSnap.data();
            cachedArchiveDocs.push({ data, docId });

            let oc = "";
            let mStr = "";

            if (docId.includes("_")) {
                const parts = docId.split("_");
                oc = parts[0].toUpperCase().trim();
                mStr = parts[1].trim();
            }

            if (!oc) oc = String(data.oc || data.osobniCislo || data.osobni_cislo || "").toUpperCase().trim();
            if (!oc && data.userEmail) {
                const email = String(data.userEmail).toLowerCase().trim();
                if (ridiciMap[email]) oc = ridiciMap[email].oc;
            }

            if (!mStr) mStr = ziskejMesicKlic(data, docId);

            if (oc && mStr && matrixGlobal[oc] && matrixGlobal[oc][mStr]) {
                const status = String(data.statusText || "").trim();
                if (status === "/" || status === "X" || status === "!" || status === "?") {
                    matrixGlobal[oc][mStr] = { type: "status", val: status };
                } else if (data.najetoKm !== undefined && data.najetoKm !== null) {
                    let cisteKm = parseKmValue(data);
                    if (matrixGlobal[oc][mStr].type !== "km") matrixGlobal[oc][mStr] = { type: "km", val: 0 };
                    matrixGlobal[oc][mStr].val += cisteKm;
                }
            }
        });

        cachedDzvaDocs = [];
        const dzvaSnapshot = await getDocs(collection(db, "dzva"));
        dzvaSnapshot.forEach(docSnap => {
            const docId = docSnap.id;
            const data = docSnap.data();
            cachedDzvaDocs.push({ data, docId });
            const email = (data.userEmail || "").toLowerCase().trim();
            
            let oc = ridiciMap[email] ? ridiciMap[email].oc : String(data.oc || data.osobniCislo || "").toUpperCase().trim();
            let mStr = ziskejMesicKlic(data, docId);

            if (oc && mStr && matrixGlobal[oc] && matrixGlobal[oc][mStr]) {
                if (matrixGlobal[oc][mStr].type !== "status") {
                    if (matrixGlobal[oc][mStr].type !== "km") {
                        matrixGlobal[oc][mStr] = { type: "km", val: 0 };
                    }
                    const plneKm = parseKmValue(data);
                    matrixGlobal[oc][mStr].val += plneKm;
                }
            }
        });

        aktivniZobrazeneMesice = orezaneSledovaneMesice.filter(m => {
            if (m === aktualniMesicKlic) return true;
            for (const oc of seznamOsobníchCiselSerazeny) {
                const cell = matrixGlobal[oc][m];
                if (cell && ((cell.type === "km" && cell.val > 0) || (cell.type === "status" && cell.val !== ""))) {
                    return true;
                }
            }
            return false;
        });

        const quartersHeaderRow = document.getElementById("quartersHeaderRow");
        const monthsHeaderRow = document.getElementById("monthsHeaderRow");

        if (quartersHeaderRow && monthsHeaderRow) {
            quartersHeaderRow.innerHTML = "<th>Kvartál →</th>";
            monthsHeaderRow.innerHTML = "<th>Řidič ↓</th>";

            let kvartalPocetSloupcu = {};
            aktivniZobrazeneMesice.forEach(m => {
                const qId = kvartalMap[m] || "unknown";
                kvartalPocetSloupcu[qId] = (kvartalPocetSloupcu[qId] || 0) + 1;
            });

            let zpracovaneKvartaly = [];
            aktivniZobrazeneMesice.forEach(m => {
                const qId = kvartalMap[m];
                if (qId && !zpracovaneKvartaly.includes(qId)) {
                    zpracovaneKvartaly.push(qId);
                    const thQ = document.createElement("th");
                    thQ.id = qId;
                    thQ.style.color = "#a0aec0";
                    thQ.colSpan = kvartalPocetSloupcu[qId];
                    const qText = qId.replace("q", "Q").replace("-", "/");
                    thQ.innerText = qText;
                    quartersHeaderRow.appendChild(thQ);
                }
            });

            const thCelkemKvartal = document.createElement("th");
            thCelkemKvartal.innerText = "celkem:";
            quartersHeaderRow.appendChild(thCelkemKvartal);

            aktivniZobrazeneMesice.forEach(m => {
                const thM = document.createElement("th");
                const [rok, mesic] = m.split("-");
                thM.innerText = `${parseInt(mesic)}/${rok.slice(-2)}`;
                monthsHeaderRow.appendChild(thM);
            });

            const thCelkemMesic = document.createElement("th");
            thCelkemMesic.innerText = "Celkem";
            monthsHeaderRow.appendChild(thCelkemMesic);
        }

        ZvyrazniHlavičku();

        const tbody = document.getElementById("overallTableBody");
        tbody.innerHTML = "";

        let celkemZaMesice = {};
        aktivniZobrazeneMesice.forEach(m => celkemZaMesice[m] = 0);
        let globalniCelkovySumar = 0;

        seznamOsobníchCiselSerazeny.forEach(oc => {
            const uData = ziskejUzivatelData(oc);
            const uRank = uData.rank;
            const uRankName = uData.rankName.toLowerCase();
            const limitProRidic = (uRank === "ridic" || uRank === "zkusebni-ridic") ? 70 : 50;
            
            let ocStyleClass = "oc-ridic"; 
            if (uRank === "management" && (uRankName.includes("úvazek") || uRankName.includes("poloviční"))) {
                ocStyleClass = "oc-majitel-polovicni-uvazek";
            } else if (uRank === "majitel") {
                ocStyleClass = "oc-majitel";
            } else if (uRank === "management") {
                ocStyleClass = "oc-management";
            } else if (uRank === "provozni-reditel" || uRank === "provozni_reditel" || uRank.includes("reditel")) {
                ocStyleClass = "oc-provozni-reditel";
            } else if (uRank === "dispecer") {
                ocStyleClass = "oc-dispecer";
            } else if (uRank === "team-manager" || uRank === "team_manager" || uRank === "manager") {
                ocStyleClass = "oc-team-manager";
            } else if (uRank === "zasloužily-ridic" || uRank === "zaslouzily_ridic") {
                ocStyleClass = "oc-zaslouzily";
            } else if (uRank === "zkusebni-ridic" || uRank === "zkusebni_ridic" || uRank.includes("zkusebni")) {
                ocStyleClass = "oc-zkusebni";
            }

            if (uRankName.includes("modder")) {
                ocStyleClass = "oc-modder";
            }

            let infoBtnHtml = "";
            if (isUserManagement) {
                infoBtnHtml = `<span class="info-btn" data-oc="${oc}" data-email="${uData.email}" title="Zobrazit graf nájezdu">ⓘ</span>`;
            }

            let rowHtml = `<tr data-oc="${oc}"><td class="${ocStyleClass}"><div class="oc-cell-wrapper"><span>${oc}</span>${infoBtnHtml}</div></td>`;
            let sumaRidicKm = 0;

            let mesicPrvniAktivity = "";
            for (const m of aktivniZobrazeneMesice) {
                if (matrixGlobal[oc][m] && ((matrixGlobal[oc][m].type === "km" && matrixGlobal[oc][m].val > 0) || matrixGlobal[oc][m].type === "status")) {
                    mesicPrvniAktivity = m;
                    break;
                }
            }
            if (!mesicPrvniAktivity) mesicPrvniAktivity = aktualniMesicKlic;

            aktivniZobrazeneMesice.forEach(m => {
                const cell = matrixGlobal[oc][m];
                const absenceType = omluvenkyMatrix[oc][m]; // "Pauza", "Omluvenka" nebo false
                const jePauza = (absenceType === "Pauza");
                const jeOmluven = (absenceType === "Omluvenka" || (cell.type === "status" && cell.val === "/"));

                if (mesicPrvniAktivity && m < mesicPrvniAktivity) {
                    rowHtml += `<td class="cell-future">-</td>`;
                }
                else if (cell.type === "status" && cell.val !== "X" && cell.val !== "/") {
                    let cssClass = "cell-future";
                    if (cell.val === "!") cssClass = "cell-chyba";
                    rowHtml += `<td class="${cssClass}">${cell.val}</td>`;
                } 
                else {
                    const kilometry = cell.type === "km" ? Math.round(cell.val) : 0;

                    if (kilometry === 0) {
                        if (jePauza) {
                            rowHtml += `<td class="cell-pauza">P</td>`;
                        } else if (jeOmluven) {
                            rowHtml += `<td class="cell-omluven">/</td>`;
                        } else if (m === aktualniMesicKlic) {
                            rowHtml += `<td class="cell-future">-</td>`;
                        } else {
                            rowHtml += `<td class="cell-neomluven">X</td>`;
                        }
                    } else {
                        sumaRidicKm += kilometry;
                        celkemZaMesice[m] += kilometry;

                        if (jePauza) {
                            rowHtml += `<td class="cell-pauza" style="font-weight:600;">${kilometry}</td>`;
                        } else if (jeOmluven) {
                            rowHtml += `<td class="cell-omluven" style="font-weight:600;">${kilometry}</td>`;
                        } else {
                            const cellBgColor = ziskejBarvuSkaly(kilometry, limitProRidic);
                            const isSplneno = kilometry >= limitProRidic;
                            const textStyle = isSplneno ? "color:#00ff66; font-weight:700;" : "color:#fff;";
                            rowHtml += `<td style="background-color: ${cellBgColor}; ${textStyle}">${kilometry}</td>`;
                        }
                    }
                }
            });

            const zaokrouhlenaSumaRidicKm = Math.round(sumaRidicKm);
            rowHtml += `<td class="cell-total-column">${zaokrouhlenaSumaRidicKm}</td></tr>`;
            globalniCelkovySumar += zaokrouhlenaSumaRidicKm;
            tbody.innerHTML += rowHtml;
        });

        let totalRowHtml = `<tr class="total-row"><td>Celkem</td>`;
        aktivniZobrazeneMesice.forEach(m => {
            totalRowHtml += `<td>${Math.round(celkemZaMesice[m])}</td>`;
        });
        totalRowHtml += `<td>${Math.round(globalniCelkovySumar)}</td></tr>`;
        
        tbody.innerHTML += totalRowHtml;

        document.querySelectorAll(".info-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const targetOc = btn.getAttribute("data-oc");
                const targetEmail = btn.getAttribute("data-email");
                openDriverModal(targetOc, targetEmail);
            });
        });

        const toggleCheckbox = document.getElementById("toggleMyHighlight");
        if (toggleCheckbox) {
            const savedState = localStorage.getItem("alces_highlight_my_profile") === "true";
            toggleCheckbox.checked = savedState;

            function AplikujZvyrazneni(st) {
                if (!myPersonalOc) return;
                const myRow = document.querySelector(`tr[data-oc="${myPersonalOc}"]`);
                if (myRow) {
                    if (st) myRow.classList.add("my-profile-highlight");
                    else myRow.classList.remove("my-profile-highlight");
                }
            }

            if (savedState) AplikujZvyrazneni(true);

            toggleCheckbox.addEventListener("change", (e) => {
                const st = e.target.checked;
                localStorage.setItem("alces_highlight_my_profile", st ? "true" : "false");
                AplikujZvyrazneni(st);
            });
        }

    } catch (err) {
        console.error("Chyba dashboardu:", err);
    }
}

function openDriverModal(oc, email) {
    isCompanyMode = false;
    currentModalOc = oc;
    currentModalEmail = email;

    document.getElementById("modalOcBox").style.display = "block";
    document.getElementById("companyDiffContainer").classList.add("hidden");
    document.getElementById("modalDriverOc").innerText = oc;
    document.getElementById("modalDriverName").innerText = `Graf řidiče (OČ: ${oc})`;

    renderModalChart();
    document.getElementById("driverGraphModal").classList.add("active");
}

function openCompanyModal() {
    isCompanyMode = true;
    currentModalOc = "";
    currentModalEmail = "";

    document.getElementById("modalOcBox").style.display = "none";
    document.getElementById("modalDriverName").innerText = `Celkový vývoj nájezdu alces, a. s.`;

    renderModalChart();
    document.getElementById("driverGraphModal").classList.add("active");
}

function computeCompanyMonthOverMonthDifferences() {
    const currIdx = sledovaneMesice.indexOf(aktualniMesicKlic);
    const lastIdx = currIdx > 0 ? currIdx - 1 : 0;
    
    const currMonthKlic = aktualniMesicKlic;
    const lastMonthKlic = sledovaneMesice[lastIdx];

    let maxInc = 0;
    let maxIncOc = "";
    let maxIncEmail = "";

    let maxDec = 0;
    let maxDecOc = "";
    let maxDecEmail = "";

    Object.keys(matrixGlobal).forEach(oc => {
        const currData = matrixGlobal[oc][currMonthKlic];
        const lastData = matrixGlobal[oc][lastMonthKlic];

        const currKm = (currData && currData.type === "km") ? currData.val : 0;
        const lastKm = (lastData && lastData.type === "km") ? lastData.val : 0;

        if (lastKm >= 1) {
            const diff = currKm - lastKm;

            let email = "";
            for (const [e, info] of Object.entries(ridiciMap)) {
                if (info.oc === oc) { email = info.email; break; }
            }

            if (diff > maxInc) {
                maxInc = diff;
                maxIncOc = oc;
                maxIncEmail = email;
            }
            if (diff < maxDec) {
                maxDec = diff;
                maxDecOc = oc;
                maxDecEmail = email;
            }
        }
    });

    topIncreaserOc = maxIncOc;
    topIncreaserEmail = maxIncEmail;
    topDecreaserOc = maxDecOc;
    topDecreaserEmail = maxDecEmail;

    const incBtn = document.getElementById("btnJumpIncrease");
    const decBtn = document.getElementById("btnJumpDecrease");

    if (maxIncOc && maxInc > 0) {
        document.getElementById("maxIncreaseText").innerText = `OČ ${maxIncOc} (+${Math.round(maxInc)} km)`;
        incBtn.style.display = "inline-block";
    } else {
        document.getElementById("maxIncreaseText").innerText = "Žádný nárůst";
        incBtn.style.display = "none";
    }

    if (maxDecOc && maxDec < 0) {
        document.getElementById("maxDecreaseText").innerText = `OČ ${maxDecOc} (${Math.round(maxDec)} km)`;
        decBtn.style.display = "inline-block";
    } else {
        document.getElementById("maxDecreaseText").innerText = "Žádný pokles";
        decBtn.style.display = "none";
    }
}

function renderModalChart() {
    const selectedPeriod = document.getElementById("modalPeriodSelect").value;
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    const diffContainer = document.getElementById("companyDiffContainer");

    if (isCompanyMode) {
        if (selectedPeriod === "thisMonth") {
            computeCompanyMonthOverMonthDifferences();
            diffContainer.classList.remove("hidden");
        } else {
            diffContainer.classList.add("hidden");
        }
    } else {
        diffContainer.classList.add("hidden");
    }

    const labelsMap = new Map();
    let totalPeriodKm = 0;

    const vsechnyDokumenty = [...cachedDzvaDocs, ...cachedArchiveDocs];

    if (selectedPeriod === "thisMonth" || selectedPeriod === "lastMonth") {
        const targetMonth = selectedPeriod === "thisMonth" ? currentMonth : (currentMonth === 0 ? 11 : currentMonth - 1);
        const targetYear = (selectedPeriod === "lastMonth" && currentMonth === 0) ? currentYear - 1 : currentYear;

        const records = [];
        vsechnyDokumenty.forEach(item => {
            const data = item.data;
            const docId = item.docId || "";
            const docEmail = (data.userEmail || "").toLowerCase().trim();
            const docOc = String(data.oc || data.osobniCislo || data.osobni_cislo || "").toUpperCase().trim();

            if (isCompanyMode || (docOc === currentModalOc || (currentModalEmail && docEmail === currentModalEmail))) {
                const km = parseKmValue(data);
                const date = parseDocDate(data, docId);

                if (date && km > 0) {
                    if (date.getMonth() === targetMonth && date.getFullYear() === targetYear) {
                        records.push({ date, km });
                    }
                }
            }
        });

        records.sort((a, b) => a.date - b.date);

        records.forEach(rec => {
            const m = rec.date.getMonth();
            const d = rec.date.getDate();
            const key = `${d}. ${m + 1}.`;
            labelsMap.set(key, (labelsMap.get(key) || 0) + rec.km);
            totalPeriodKm += rec.km;
        });

    } else {
        const currIdx = sledovaneMesice.indexOf(aktualniMesicKlic);
        let targetMonths = [];

        if (selectedPeriod === "last3Months") {
            const start = Math.max(0, currIdx - 2);
            targetMonths = sledovaneMesice.slice(start, currIdx + 1);
        } else if (selectedPeriod === "thisYear") {
            const currentYearStr = String(new Date().getFullYear());
            targetMonths = sledovaneMesice.filter(m => m.startsWith(currentYearStr));
        } else {
            if (!isCompanyMode && currentModalOc) {
                let firstActiveIndex = -1;
                aktivniZobrazeneMesice.forEach((m, idx) => {
                    const cell = matrixGlobal[currentModalOc][m];
                    if (firstActiveIndex === -1 && cell && ((cell.type === "km" && cell.val > 0) || (cell.type === "status" && cell.val !== "" && cell.val !== "-"))) {
                        firstActiveIndex = idx;
                    }
                });
                if (firstActiveIndex !== -1) {
                    targetMonths = aktivniZobrazeneMesice.slice(firstActiveIndex);
                } else {
                    targetMonths = [...aktivniZobrazeneMesice];
                }
            } else {
                targetMonths = [...aktivniZobrazeneMesice];
            }
        }

        targetMonths.forEach(mKlic => {
            const [r, m] = mKlic.split("-");
            const label = `${parseInt(m)}/${r.slice(-2)}`;

            let mSum = 0;
            if (isCompanyMode) {
                Object.keys(matrixGlobal).forEach(oc => {
                    const cell = matrixGlobal[oc][mKlic];
                    if (cell && cell.type === "km") {
                        mSum += cell.val;
                    }
                });
            } else if (currentModalOc && matrixGlobal[currentModalOc]) {
                const cell = matrixGlobal[currentModalOc][mKlic];
                if (cell && cell.type === "km") {
                    mSum += cell.val;
                }
            }

            if (selectedPeriod === "allTime" || selectedPeriod === "thisYear") {
                if (!isCompanyMode && mSum === 0 && labelsMap.size === 0) {
                    return; 
                }
            }

            labelsMap.set(label, Math.round(mSum));
            totalPeriodKm += mSum;
        });
    }

    document.getElementById("modalDriverKm").innerText = Math.round(totalPeriodKm).toLocaleString("cs-CZ") + " km";

    const ctx = document.getElementById("driverChartCanvas").getContext("2d");
    const labels = Array.from(labelsMap.keys());
    const values = Array.from(labelsMap.values());

    if (modalChartInstance) {
        modalChartInstance.destroy();
    }

    const chartTitle = isCompanyMode ? "Celkový firemní nájezd (km)" : "Osobní nájezd (km)";
    const lineColor = isCompanyMode ? "#ffd84d" : "#00ff66";
    const bgGradient = isCompanyMode ? "rgba(255, 216, 77, 0.15)" : "rgba(0, 255, 102, 0.12)";

    modalChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: chartTitle,
                data: values,
                borderColor: lineColor,
                backgroundColor: bgGradient,
                borderWidth: 3,
                fill: true,
                tension: 0.3,
                pointBackgroundColor: '#ffffff',
                pointRadius: 4,
                pointHoverRadius: 7
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                    ticks: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'Poppins' } }
                },
                y: {
                    grid: { color: 'rgba(255, 255, 255, 0.1)' },
                    ticks: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'Poppins' } }
                }
            },
            plugins: {
                legend: { labels: { color: '#ffffff', font: { family: 'Poppins' } } },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` Nájezd: ${Math.round(context.raw).toLocaleString('cs-CZ')} km`;
                        }
                    }
                }
            }
        }
    });
}

function upravFaviconuPodleRezimu() {
    const favicon = document.getElementById('favicon');
    if (!favicon) return;
    const jeTemnyRezim = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (jeTemnyRezim) {
        favicon.href = 'fotky/univ/favicon.png';  
    } else {
        favicon.href = 'fotky/univ/favicon-cerna.png'; 
    }
}

upravFaviconuPodleRezimu();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', upravFaviconuPodleRezimu);
</script>
