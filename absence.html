                    </tr>
                </thead>
                <tbody id="myAbsenceList">
                    <tr>
                        <td colspan="4" style="opacity: 0.5; padding: 20px; text-align: center;">Načítám z databáze...</td>
                    </tr>

<script>
let calculatedFromValue = "";
let calculatedToValue = "";

function handleTypeChange() {
    const type = document.getElementById("absenceType").value;
    const inputFrom = document.getElementById("absenceFrom");
    const inputTo = document.getElementById("absenceTo");
    const groupTo = document.getElementById("groupTo");
    const labelFrom = document.getElementById("labelFrom");

    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth(); // 0-11
    const currentDate = now.getDate();
    
    const lastDayOfMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const daysRemaining = lastDayOfMonth - currentDate;

    if (type === "Omluvenka") {
        groupTo.style.display = "none";
        inputTo.removeAttribute("required");
        labelFrom.innerText = "Měsíc k omluvení";
        
        const currentMonthString = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
        calculatedFromValue = currentMonthString;
        calculatedToValue = "";
        inputFrom.value = currentMonthString;
    } else {
        groupTo.style.display = "flex";
        inputTo.setAttribute("required", "true");
        labelFrom.innerText = "Od měsíce";
        
        let targetMonthOffset = 1; 
        if (daysRemaining < 5) {
            targetMonthOffset = 2; 
        }

        const startDate = new Date(currentYear, currentMonth + targetMonthOffset, 1);
        const startYear = startDate.getFullYear();
        const startMonthStr = String(startDate.getMonth() + 1).padStart(2, '0');
        calculatedFromValue = `${startYear}-${startMonthStr}`;
        inputFrom.value = calculatedFromValue;

        const endDate = new Date(startYear, startDate.getMonth() + 2, 1);
        calculatedToValue = `${endDate.getFullYear()}-${String(endDate.getMonth() + 1).padStart(2, '0')}`;
        inputTo.value = calculatedToValue;
    }
}

window.addEventListener("DOMContentLoaded", handleTypeChange);

let loadedAbsencesData = {};

function openDetailModal(id) {
    const item = loadedAbsencesData[id];
    if (!item) return;

    document.getElementById("modalType").innerText = item.type;
    
    const mFrom = formatMonthHTML(item.from);
    const mTo = formatMonthHTML(item.to);
    document.getElementById("modalTermin").innerText = item.type === "Omluvenka" ? mFrom : `${mFrom} - ${mTo}`;
    
    document.getElementById("modalReason").innerText = item.reason || "Bez poznámky";

    let statusText = "⏳ Čeká na vyřízení";
    if (item.status === "schvaleno") statusText = "✓ Schváleno";
    if (item.status === "zamitnuto") statusText = "✕ Zamítnuto";
    document.getElementById("modalStatusBadge").innerText = statusText;

    document.getElementById("modalAdminNote").innerText = item.adminNote ? item.adminNote : "-";

    document.getElementById("detailModal").classList.add("open");
}

function closeDetailModal() {
    document.getElementById("detailModal").classList.remove("open");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAwRV2OuIhA-oyg295gIv5-4zfzO4qb9MY",
    authDomain: "alces-d505c.firebaseapp.com",
    projectId: "alces-d505c",
    storageBucket: "alces-d505c.firebasestorage.app",
    messagingSenderId: "318520073072",
    appId: "1:318520073072:web:53ab5c0033f60e96bbcdb5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let userEmail = "";
let myAllAbsencesHistory = [];

onAuthStateChanged(auth, async (user) => {
    if (user) {
        userEmail = user.email;
        await loadMyAbsences();

        const allowedManagementRanks = ["team-manager", "dispecer", "provozni-reditel", "management", "majitel"];
        const userRankForMenu = localStorage.getItem("rank") || "";
        if (allowedManagementRanks.includes(userRankForMenu)) {
            const toggleBtn = document.getElementById("menuToggleBtn");
            if (toggleBtn) toggleBtn.style.display = "inline-block";
        }
    } else {
        window.location.href = "login.html";
    }
});

function formatMonthHTML(monthString) {
    if (!monthString) return "";
    const [year, month] = monthString.split("-");
    const date = new Date(year, parseInt(month) - 1, 1);
    const text = date.toLocaleDateString("cs-CZ", { month: "long", year: "numeric" });
    return text.charAt(0).toUpperCase() + text.slice(1);
}
window.formatMonthHTML = formatMonthHTML;

function getQuarter(monthStr) {
    if (!monthStr) return 1;
    const month = parseInt(monthStr.split("-")[1], 10);
    return Math.ceil(month / 3);
}

// Pomocná funkce pro převod "YYYY-MM" na celkový počet měsíců od epochy
function monthToNumber(monthStr) {
    if (!monthStr) return 0;
    const [y, m] = monthStr.split("-").map(Number);
    return y * 12 + m;
}

async function loadMyAbsences() {
    const tbody = document.getElementById("myAbsenceList");
    if (!tbody) return;
    tbody.innerHTML = "";
    loadedAbsencesData = {};
    myAllAbsencesHistory = [];

    try {
        const q = query(collection(db, "absences"), where("userEmail", "==", userEmail));
        const querySnapshot = await getDocs(q);
        let count = 0;

        querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const docId = docSnap.id;
            loadedAbsencesData[docId] = data;
            myAllAbsencesHistory.push({ id: docId, data: data });
            count++;

            let statusBadge = `<span style="color: #ffd84d; font-weight:600;">⏳ Čeká</span>`;
            if (data.status === "schvaleno") statusBadge = `<span style="color: #00ff66; font-weight:600;">✓ Schváleno</span>`;
            if (data.status === "zamitnuto") statusBadge = `<span style="color: #ff4d4d; font-weight:600;">✕ Zamítnuto</span>`;

            const mFrom = formatMonthHTML(data.from);
            const mTo = formatMonthHTML(data.to);

            tbody.innerHTML += `
                <tr>
                    <td style="font-weight: 600;">${data.type}</td>
                    <td>${data.type === "Omluvenka" ? mFrom : `${mFrom} -${mTo}`}</td>
                    <td>${statusBadge}</td>
                    <td><button class="btn-detail" onclick="openDetailModal('${docId}')">Zobrazit detail</button></td>
                </tr>
            `;
        });

        if (count === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="opacity: 0.5; padding: 25px; text-align: center;">Zatím jsi nepodal žádnou žádost.</td></tr>`;
        }
    } catch (err) {
        console.error(err);
    }
}

// Pokročilá validace pravidel 3.5.1 a 3.5.2 před odesláním
function validateBeforeSubmit(type, fromVal) {
    // Bereme v potaz pouze schválené nebo již čekající žádosti
    const activeHistory = myAllAbsencesHistory.filter(item => item.data.status === "schvaleno" || item.data.status === "ceka");

    const targetYear = fromVal.split("-")[0];
    const targetQ = getQuarter(fromVal);
    const targetMonthNum = monthToNumber(fromVal);

    // 1. KONTROLA PRAVIDLA 2 MĚSÍCŮ PO PAUZĚ (3.5.2):
    // "další dva měsíce nesmí být omluveny či nedojety [po pauze]"
    for (const item of activeHistory) {
        if (item.data.type === "Pauza" && item.data.to) {
            const pauseEndMonthNum = monthToNumber(item.data.to); // poslední měsíc pauzy (např. prosinec)
            // Zakázané měsíce jsou přesně následující 2 měsíce po skončení pauzy
            if (targetMonthNum > pauseEndMonthNum && targetMonthNum <= pauseEndMonthNum + 2) {
                return `Chyba podle pravidla 3.5.2: Od tvojí poslední pauzy neuplynuly povinné 2 měsíce bez omluvenek!`;
            }
        }
    }

    if (type === "Omluvenka") {
        // Zjistíme, v jakém kvartálu byl předchozí kvartál (pro kontrolu zákazu v následujícím kvartálu)
        // Kvartál před tímto:
        let prevQ = targetQ - 1;
        let prevQYear = parseInt(targetYear, 10);
        if (prevQ === 0) {
            prevQ = 4;
            prevQYear -= 1;
        }

        // Kolik omluvenek měl řidič v MINULÉM kvartálu? Pokud 2 nebo více, ztrácí nárok na omluvenku v tomto kvartálu!
        const omluvenkyMinulyKvartal = activeHistory.filter(item => {
            if (item.data.type !== "Omluvenka") return false;
            const m = item.data.from;
            return m && m.startsWith(prevQYear) && getQuarter(m) === prevQ;
        });

        if (omluvenkyMinulyKvartal.length >= 2) {
            return `Chyba podle pravidla 3.5.1: V minulém kvartálu jsi se omluvil/a 2×, proto ztrácíš nárok na omluvenku v tomto následujícím kvartálu!`;
        }

        // Kolik omluvenek už má v tomto aktuálním kvartálu? (Max 1 za kvartál)
        const omluvenkyTentoKvartal = activeHistory.filter(item => {
            if (item.data.type !== "Omluvenka") return false;
            const m = item.data.from;
            return m && m.startsWith(targetYear) && getQuarter(m) === targetQ;
        });

        if (omluvenkyTentoKvartal.length >= 1) {
            return `Chyba podle pravidla 3.5.1: Na tento kvartál už máš vyčerpanou omluvenku (má-li řidič 2 omluvenky, platí přísnější postihy).`;
        }

    } else if (type === "Pauza") {
        // Max 1 pauza za rok
        const pauzyRok = activeHistory.filter(item => {
            if (item.data.type !== "Pauza") return false;
            const m = item.data.from;
            return m && m.startsWith(targetYear);
        });

        if (pauzyRok.length >= 1) {
            return "Chyba podle pravidla 3.5.2: O pauzu si můžeš zažádat maximálně 1× za kalendářní rok!";
        }

        // Měsíc před pauzou nesmí být omluven
        const prevDate = new Date(parseInt(targetYear, 10), targetMonthNum % 12 - 2, 1);
        const prevMonthStr = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;

        const omluvenaPredchazi = activeHistory.find(item => {
            if (item.data.type !== "Omluvenka") return false;
            return item.data.from === prevMonthStr;
        });

        if (omluvenaPredchazi) {
            return `Chyba podle pravidla 3.5.2: Měsíc předcházející pauze (${formatMonthHTML(prevMonthStr)}) nesmí být omluven!`;
        }
    }
    return null;
}

document.getElementById("absenceForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById("absenceSubmitBtn");
    if (submitBtn.disabled) return;

    const type = document.getElementById("absenceType").value;
    const fromValue = calculatedFromValue;
    let toValue = calculatedToValue;
    const reason = document.getElementById("absenceReason").value.trim();
    const userName = localStorage.getItem("username") || "Řidič";

    // Ověření pravidel před odesláním
    const ruleError = validateBeforeSubmit(type, fromValue);
    if (ruleError) {
        alert(ruleError);
        return;
    }

    if (type !== "Pauza") {
        toValue = ""; 
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Odesílám...";

    const newRequest = {
        userEmail: userEmail,
        userName: userName,
        type: type,
        from: fromValue,
        to: toValue,
        reason: reason,
        status: "ceka",
        createdAt: new Date()
    };

    try {
        await addDoc(collection(db, "absences"), newRequest);

        const discordWebhookUrl = "https://discord.com/api/webhooks/1513537254755405956/aDusJk9CZCpnMYXvOblvGPsHYhQ5oVUKyJ0-ln1tFAW8IHdgHKuzFimWU8ppdISxJb-R"; 
        
        const mFrom = formatMonthHTML(fromValue);
        const mTo = formatMonthHTML(toValue);

        const discordMessage = {
            content: "<@1159375700889972736>",
            embeds: [{
                title: type === "Omluvenka" ? "Nová omluvenka ke schválení" : "Nová žádost o pauzu (3 měsíce)",
                color: type === "Omluvenka" ? 16738657 : 16766029,
                fields: [
                    { name: "Řidič", value: `**${userName}** (${userEmail})`, inline: true },
                    { name: "Typ", value: type, inline: true },
                    { name: "Termín", value: type === "Omluvenka" ? mFrom : `${mFrom} - ${mTo}`, inline: false },
                    { name: "Důvod", value: reason, inline: false }
                ],
                footer: { text: "alcesas.fun" },
                timestamp: new Date().toISOString()
            }]
        };

        fetch(discordWebhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(discordMessage)
        }).catch(err => console.error(err));

        alert("Žádost byla úspěšně odeslána.");
        document.getElementById("absenceForm").reset();
        handleTypeChange(); 
        await loadMyAbsences();
    } catch (err) {
        alert("Chyba při odesílání: " + err.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Odeslat žádost";
    }
});

function upravFaviconuPodleRezimu() {
    const favicon = document.getElementById('favicon');
    if (!favicon) return;
    const jeTemnyRezim = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (jeTemnyRezim) {
        favicon.href = 'fotky/univ/favicon.png';  
    } else {
        favicon.href = 'fotky/univ/favicon-cerna.png'; 
    }
}

upravFaviconuPodleRezimu();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', upravFaviconuPodleRezimu);
</script>
