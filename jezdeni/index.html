<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Řidičský panel | alces, a. s.</title>
    <link rel="icon" href="../fotky/univ/favicon.png" type="image/png" id="favicon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Poppins', Arial, sans-serif; background: #121212; min-height: 100vh; color: white; padding-bottom: 40px; }
        .topbar {
            height: 58px; position: fixed; top: 16px; left: 24px; right: 24px; z-index: 999;
            background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-radius: 24px;
            backdrop-filter: blur(24px); box-sizing: border-box;
        }
        .topbar .logo img { height: 34px; display: block; }
        .topbar a { color: white; text-decoration: none; font-weight: 600; }
        .topbar a:hover { color: #ffd84d; }

        .content { margin: 110px 24px 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 900px) { .content { grid-template-columns: 1fr; } }

        .panel {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 20px; backdrop-filter: blur(12px);
        }
        .panel h2 { margin-top: 0; font-size: 18px; color: #ffd84d; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }

        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; font-weight: 600; opacity: 0.9; }
        input, select, textarea {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            color: white; padding: 10px; font-family: 'Poppins', sans-serif; font-size: 13px; box-sizing: border-box; width: 100%;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ffd84d; }

        button {
            font-family: 'Poppins', sans-serif; font-weight: 600; padding: 10px 16px;
            border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; font-size: 13px;
        }
        .btn-primary { background: #ffd84d; color: black; width: 100%; }
        .btn-primary:hover { background: #e6c240; }
        .btn-danger { background: rgba(212,0,0,0.2); color: #ff4d4d; border: 1px solid rgba(212,0,0,0.4); width: 100%; }
        .btn-danger:hover { background: rgba(212,0,0,0.4); }

        .chat-box { height: 160px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; border: 1px solid rgba(255,255,255,0.08); font-size: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
        .msg-item { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 8px; border-left: 3px solid #ffd84d; }

        /* Modal pro vstupní výběr směny */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .modal-box {
            background: rgba(25,25,25,0.95); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
            padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        .full-width { grid-column: span 2; }
        @media(max-width: 900px) { .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo"><a href="../home.html"><img src="../fotky/univ/logo.png" alt="alces"></a></div>
    <div><a href="../home.html">Domů</a></div>
</div>

<!-- ÚVODNÍ OKNO PRO ZADÁNÍ SMĚNY A AKTIVITY -->
<div id="startModal" class="modal-overlay">
    <div class="modal-box">
        <h2 style="color: #ffd84d; margin-top: 0;">Zadej turnus</h2>
        <p style="font-size: 13px; opacity: 0.8; margin-bottom: 20px;">Zadej, jaký turnus jedeš, následně potrvrď.</p>
        <div class="form-group" style="text-align: left;">
            <label>Název turnusu:</label>
            <input type="text" id="modalShiftInput" placeholder="např. pid2">
        </div>
        <button class="btn-primary" id="modalConfirmBtn" style="margin-top: 15px;">Uložit</button>
    </div>
</div>

<div class="content" id="mainDashboard" style="display: none;">
    
    <!-- OZNÁMENÍ VŠEM -->
    <div class="panel">
        <h2>Obecná oznámení z dispečinku</h2>
        <div class="chat-box" id="generalAnnouncementsList">
            <span style="opacity: 0.5;">Žádná obecná oznámení...</span>
        </div>
    </div>

    <!-- SOUKROMÉ ZPRÁVY ŘIDIČI -->
    <div class="panel">
        <h2>Přímé zprávy</h2>
        <div class="chat-box" id="privateMessagesList">
            <span style="opacity: 0.5;">Žádné osobní zprávy...</span>
        </div>
    </div>

    <!-- ODESLAT ŽÁDOST / ZPRÁVU DISPEČEROVI -->
    <div class="panel">
        <h2>Napsat aktivnímu dispečerovi</h2>
        <form id="msgToDispatcherForm">
            <div class="form-group">
                <label>Zpráva / Žádost</label>
                <textarea id="dispatcherMsgText" placeholder="Napiš dispečerovi co potřebuješ..." required style="min-height: 80px;"></textarea>
            </div>
            <button type="submit" class="btn-primary">Odeslat dispečerovi</button>
        </form>
    </div>

    <!-- OVLÁDÁNÍ STAVU A ODCHOD -->
    <div class="panel">
        <h2>Aktivní stav</h2>
        <div class="form-group">
            <label>Můj aktuální stav</label>
            <select id="driverStatusSelect">
                <option value="Aktivní" selected>Aktivní</option>
                <option value="AFK">AFK)</option>
            </select>
        </div>
        <div class="form-group" style="margin-top: 15px;">
            <label>Změnit probíhající směnu</label>
            <input type="text" id="activeShiftInput">
        </div>
        <button class="btn-danger" id="leaveDrivingBtn" style="margin-top: 15px;">Ukončit a odejít z ježdění</button>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy, limit, deleteDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAwRV2OuIhA-oyg295gIv5-4zfzO4qb9MY",
    authDomain: "alces-d505c.firebaseapp.com",
    projectId: "alces-d505c",
    storageBucket: "alces-d505c.firebasestorage.app",
    messagingSenderId: "318520073072",
    appId: "1:318520073072:web:53ab5c0033f60e96bbcdb5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUserEmail = "";
let currentUserName = "";
let currentUserOc = "";

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    currentUserEmail = user.email.toLowerCase();
    
    // Zjištění profilu řidiče z DB
    const uSnap = await getDoc(doc(db, "users", currentUserEmail));
    if (uSnap.exists()) {
        const data = uSnap.data();
        currentUserName = data.name || data.username || currentUserEmail;
        currentUserOc = String(data.oc || data.osobniCislo || "0000");
    }

    // Zkontroluj, jestli už řidič náhodou nemá aktivní relaci
    const activeRef = doc(db, "active_drivers", currentUserEmail);
    const activeSnap = await getDoc(activeRef);
    if (activeSnap.exists()) {
        // Už je přihlášený v jízdách, rovnou ho pustíme dovnitř
        document.getElementById("startModal").style.display = "none";
        document.getElementById("mainDashboard").style.display = "grid";
        document.getElementById("activeShiftInput").value = activeSnap.data().shift || "Standardní směna";
        document.getElementById("driverStatusSelect").value = activeSnap.data().status || "Aktivní";
        initLiveListeners();
    }
});

// Potvrzení úvodního modálu
document.getElementById("modalConfirmBtn").addEventListener("click", async () => {
    const shiftVal = document.getElementById("modalShiftInput").value.trim();
    if (!shiftVal) {
        alert("Prosím zadej, co jedeš za směnu.");
        return;
    }

    try {
        await setDoc(doc(db, "active_drivers", currentUserEmail), {
            email: currentUserEmail,
            name: currentUserName,
            oc: currentUserOc,
            shift: shiftVal,
            status: "Aktivní",
            joinedAt: new Date().toISOString()
        });

        document.getElementById("startModal").style.display = "none";
        document.getElementById("mainDashboard").style.display = "grid";
        document.getElementById("activeShiftInput").value = shiftVal;
        initLiveListeners();
    } catch(e) {
        alert("Chyba při inicializaci: " + e.message);
    }
});

// Změna stavu (Aktivní / AFK) nebo změna textu směny
document.getElementById("driverStatusSelect").addEventListener("change", updateDriverPresence);
document.getElementById("activeShiftInput").addEventListener("input", updateDriverPresence);

async function updateDriverPresence() {
    const status = document.getElementById("driverStatusSelect").value;
    const shift = document.getElementById("activeShiftInput").value.trim();
    try {
        await setDoc(doc(db, "active_drivers", currentUserEmail), {
            email: currentUserEmail,
            name: currentUserName,
            oc: currentUserOc,
            shift: shift,
            status: status,
            joinedAt: new Date().toISOString()
        }, { merge: true });
    } catch(e) { console.error(e); }
}

// Odeslání zprávy dispečerovi
document.getElementById("msgToDispatcherForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = document.getElementById("dispatcherMsgText").value.trim();
    if (!text) return;

    try {
        await addDoc(collection(db, "dispatcher_messages"), {
            fromEmail: currentUserEmail,
            fromName: currentUserName,
            fromOc: currentUserOc,
            text: text,
            createdAt: new Date().toISOString(),
            read: false
        });
        document.getElementById("dispatcherMsgText").value = "";
        alert("Zpráva byla úspěšně odeslána dispečerovi.");
    } catch(e) {
        alert("Chyba: " + e.message);
    }
});

// Odchod z ježdění
document.getElementById("leaveDrivingBtn").addEventListener("click", async () => {
    if (!confirm("Opravdu chceš ukončit a odejít z ježdění?")) return;
    try {
        await deleteDoc(doc(db, "active_drivers", currentUserEmail));
        window.location.href = "home.html";
    } catch(e) {
        alert("Chyba: " + e.message);
    }
});

// Real-time listenery pro oznámení a zprávy
function initLiveListeners() {
    // 1. Obecná oznámení
    onSnapshot(query(collection(db, "announcements_general"), orderBy("createdAt", "desc"), limit(20)), (snapshot) => {
        const box = document.getElementById("generalAnnouncementsList");
        box.innerHTML = "";
        if (snapshot.empty) {
            box.innerHTML = `<span style="opacity: 0.5;">Žádná obecná oznámení...</span>`;
            return;
        }
        snapshot.forEach(doc => {
            const data = doc.data();
            box.innerHTML += `<div class="msg-item"><strong>${data.sender || 'Vedení'}</strong>: ${data.text}</div>`;
        });
    });

    // 2. Soukromé zprávy pro tohoto řidiče
    onSnapshot(query(collection(db, `drivers_private_msg_${currentUserEmail}`), orderBy("createdAt", "desc"), limit(20)), (snapshot) => {
        const box = document.getElementById("privateMessagesList");
        box.innerHTML = "";
        if (snapshot.empty) {
            box.innerHTML = `<span style="opacity: 0.5;">Žádné osobní zprávy...</span>`;
            return;
        }
        snapshot.forEach(doc => {
            const data = doc.data();
            box.innerHTML += `<div class="msg-item" style="border-left-color: #66b2ff;"><strong>${data.sender || 'Dispečink'}</strong>: ${data.text}</div>`;
        });
    });
}
</script>
</body>
</html>
