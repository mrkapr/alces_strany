<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispečerský panel | alces, a. s.</title>
    <link rel="icon" href="../fotky/univ/favicon.png" type="image/png" id="favicon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Poppins', Arial, sans-serif; background: #121212; min-height: 100vh; color: white; padding-bottom: 40px; }
        .topbar {
            height: 58px; position: fixed; top: 16px; left: 24px; right: 24px; z-index: 999;
            background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-radius: 24px;
            backdrop-filter: blur(24px); box-sizing: border-box;
        }
        .topbar .logo img { height: 34px; display: block; }
        .topbar a { color: white; text-decoration: none; font-weight: 600; }
        .topbar a:hover { color: #ffd84d; }

        .content { margin: 110px 24px 20px 24px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        @media(max-width: 1000px) { .content { grid-template-columns: 1fr; } }

        .panel {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 20px; backdrop-filter: blur(12px); margin-bottom: 20px;
        }
        .panel h2 { margin-top: 0; font-size: 18px; color: #ffd84d; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }

        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; font-weight: 600; opacity: 0.9; }
        input, select, textarea {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            color: white; padding: 10px; font-family: 'Poppins', sans-serif; font-size: 13px; box-sizing: border-box; width: 100%;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ffd84d; }

        button {
            font-family: 'Poppins', sans-serif; font-weight: 600; padding: 10px 16px;
            border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; font-size: 13px;
        }
        .btn-primary { background: #ffd84d; color: black; width: 100%; }
        .btn-primary:hover { background: #e6c240; }

        .driver-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        .driver-table th, .driver-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .driver-table th { color: #ffd84d; font-size: 11px; text-transform: uppercase; }

        .msg-box { height: 160px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; border: 1px solid rgba(255,255,255,0.08); font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
        .msg-item { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 8px; border-left: 3px solid #66b2ff; }

        #error-screen { display: none; text-align: center; margin-top: 150px; color: #ff4d4d; font-size: 20px; font-weight: 700; }
        
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 9999; display: flex; align-items: center; justify-content: center; text-align: center;
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo"><a href="../home.html"><img src="../fotky/univ/logo.png" alt="alces"></a></div>
    <div><a href="../home.html">Domů</a></div>
</div>

<div id="error-screen">Ověřuji oprávnění a dostupnost dispečinku...</div>

<div id="busyModal" class="modal-overlay" style="display: none;">
    <div class="modal-box" style="background: rgba(25,25,25,0.95); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 30px; width: 90%; max-width: 400px;">
        <h2 style="color: #ff4d4d; margin-top: 0;">Dispečink je obsazen</h2>
        <p style="font-size: 13px; opacity: 0.8; margin-bottom: 20px;" id="busyModalText">Na stránce je již aktivní jiný dispečer.</p>
        <a href="home.html" class="btn-primary" style="display: block; text-decoration: none; padding: 12px; text-align: center; color: black; box-sizing: border-box;">Zpět domů</a>
    </div>
</div>

<div class="content" id="mainDashboard" style="display: none;">

    <div>
        <div class="panel">
            <h2>Aktivní řidiči v provozu</h2>
            <div style="overflow-x: auto;">
                <table class="driver-table">
                    <thead>
                        <tr>
                            <th>OČ / Jméno</th>
                            <th>Směna</th>
                            <th>Stav</th>
                        </tr>
                    </thead>
                    <tbody id="activeDriversTbody">
                        <tr><td colspan="3" style="opacity: 0.5;">Žádní aktivní řidiči...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel">
            <h2>Příchozí zprávy od řidičů</h2>
            <div class="msg-box" id="incomingDispatcherMsgs">
                <span style="opacity: 0.5;">Žádné nové zprávy...</span>
            </div>
        </div>
    </div>

    <div>
        <!-- Hromadné oznámení -->
        <div class="panel">
            <h2>Hromadné oznámení</h2>
            <form id="globalAnnounceForm">
                <div class="form-group">
                    <label>Text oznámení pro všechny</label>
                    <textarea id="globalText" placeholder="Napište hromadnou zprávu..." required style="min-height: 70px;"></textarea>
                </div>
                <button type="submit" class="btn-primary">Odeslat všem</button>
            </form>
        </div>

        <div class="panel">
            <h2>Zpráva konkrétnímu řidiči</h2>
            <form id="privateMsgForm">
                <div class="form-group">
                    <label>Vyber řidiče</label>
                    <select id="targetDriverSelect" required>
                        <option value="">-- Vyber aktivního řidiče --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Zpráva</label>
                    <textarea id="privateText" placeholder="Zpráva pro zvoleného řidiče..." required style="min-height: 70px;"></textarea>
                </div>
                <button type="submit" class="btn-primary">Odeslat řidiči</button>
            </form>
        </div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy, limit, deleteDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAwRV2OuIhA-oyg295gIv5-4zfzO4qb9MY",
    authDomain: "alces-d505c.firebaseapp.com",
    projectId: "alces-d505c",
    storageBucket: "alces-d505c.firebasestorage.app",
    messagingSenderId: "318520073072",
    appId: "1:318520073072:web:53ab5c0033f60e96bbcdb5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const allowedManagementRanks = ["dispecer", "team-manager", "provozni-reditel", "management", "majitel"];

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    const email = user.email.toLowerCase();

    const uSnap = await getDoc(doc(db, "users", email));
    if (!uSnap.exists()) {
        showError("Účet nemá oprávnění.");
        return;
    }
    const uData = uSnap.data();
    const rank = uData.rank || "";
    const oc = String(uData.oc || uData.osobniCislo || "");
    const userName = uData.name || uData.username || email;

    if (!allowedManagementRanks.includes(rank)) {
        showError("Přístup odepřen. Tento panel je určen pouze pro dispečink a vedení.");
        return;
    }

    const activeDispatcherRef = doc(db, "system_state", "active_dispatcher");
    const dispatcherSnap = await getDoc(activeDispatcherRef);

    const nowTimestamp = Date.now();
    let currentDispatcher = dispatcherSnap.exists() ? dispatcherSnap.data() : null;

    if (currentDispatcher && (nowTimestamp - currentDispatcher.lastHeartbeat > 30000) && currentDispatcher.email !== email) {
        currentDispatcher = null;
    }

    if (currentDispatcher && currentDispatcher.email !== email && oc !== "7001") {
        document.getElementById("error-screen").style.display = "none";
        document.getElementById("busyModal").style.display = "flex";
        document.getElementById("busyModalText").innerHTML = `Na dispečinku je aktuálně aktivní: <strong>${currentDispatcher.name}</strong>. Přístup má pouze 1 dispečer v jeden moment.`;
        return;
    }

    await setDoc(activeDispatcherRef, {
        email: email,
        name: userName,
        oc: oc,
        lastHeartbeat: nowTimestamp
    });

    setInterval(async () => {
        try {
            await setDoc(activeDispatcherRef, {
                email: email,
                name: userName,
                oc: oc,
                lastHeartbeat: Date.now()
            }, { merge: true });
        } catch(e) {}
    }, 10000);

    window.addEventListener("beforeunload", () => {
        navigator.sendBeacon ? null : deleteDoc(activeDispatcherRef); // fallback
    });

    document.getElementById("error-screen").style.display = "none";
    document.getElementById("mainDashboard").style.display = "grid";
    initDispatcherListeners(userName);
});

function showError(msg) {
    const err = document.getElementById("error-screen");
    err.innerText = msg;
    err.style.display = "block";
}

function initDispatcherListeners(dispatcherName) {
    onSnapshot(collection(db, "active_drivers"), (snapshot) => {
        const tbody = document.getElementById("activeDriversTbody");
        const select = document.getElementById("targetDriverSelect");
        
        tbody.innerHTML = "";
        select.innerHTML = `<option value="">-- Vyber aktivního řidiče --</option>`;

        if (snapshot.empty) {
            tbody.innerHTML = `<tr><td colspan="3" style="opacity: 0.5;">Žádní aktivní řidiči...</td></tr>`;
            return;
        }

        snapshot.forEach(doc => {
            const data = doc.data();
            const statusColor = data.status === "Aktivní" ? "#00ff66" : "#ffaa00";
            
            tbody.innerHTML += `
                <tr>
                    <td><strong>${data.name}</strong><br><span style="font-size:11px; opacity:0.6;">OČ: ${data.oc || '-'}</span></td>
                    <td>${data.shift || 'Nezadáno'}</td>
                    <td><span style="color: ${statusColor}; font-weight:600;">${data.status}</span></td>
                </tr>
            `;

            select.innerHTML += `<option value="${data.email}">${data.name} (OČ: ${data.oc || '-'})</option>`;
        });
    });

    onSnapshot(query(collection(db, "dispatcher_messages"), orderBy("createdAt", "desc"), limit(30)), (snapshot) => {
        const box = document.getElementById("incomingDispatcherMsgs");
        box.innerHTML = "";
        if (snapshot.empty) {
            box.innerHTML = `<span style="opacity: 0.5;">Žádné nové zprávy...</span>`;
            return;
        }
        snapshot.forEach(doc => {
            const data = doc.data();
            box.innerHTML += `
                <div class="msg-item">
                    <strong>${data.fromName}</strong> (OČ: ${data.fromOc || '-'}):<br>
                    ${data.text}
                </div>
            `;
        });
    });

    document.getElementById("globalAnnounceForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = document.getElementById("globalText").value.trim();
        if (!text) return;

        try {
            await addDoc(collection(db, "announcements_general"), {
                sender: dispatcherName,
                text: text,
                createdAt: new Date().toISOString()
            });
            document.getElementById("globalText").value = "";
            alert("Hromadné oznámení bylo úspěšně odesláno všem řidičům.");
        } catch(e) {
            alert("Chyba: " + e.message);
        }
    });

    document.getElementById("privateMsgForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const targetEmail = document.getElementById("targetDriverSelect").value;
        const text = document.getElementById("privateText").value.trim();
        if (!targetEmail || !text) {
            alert("Vyber řidiče a napiš text zprávy.");
            return;
        }

        try {
            await addDoc(collection(db, `drivers_private_msg_${targetEmail}`), {
                sender: `Dispečink (${dispatcherName})`,
                text: text,
                createdAt: new Date().toISOString()
            });
            document.getElementById("privateText").value = "";
            alert("Soukromá zpráva byla řidiči doručena.");
        } catch(e) {
            alert("Chyba: " + e.message);
        }
    });
}
</script>
</body>
</html>
