<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přihlášení | alces, a. s.</title>
<link rel="icon" href="favicon.png" type="image/png" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Poppins', Arial, sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                url("fotky/login/login.png") center / cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.login {
    text-align: center;
    width: 430px;
    padding: 28px 24px;
    position: relative;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.14);
    transition: transform 0.3s ease;
}

/* 🚀 NAČÍTACÍ EFEKT - ZAMAZÁNÍ OBSAHU */
.login-content {
    transition: filter 0.3s ease, opacity 0.3s ease;
}

.login.is-loading .login-content {
    filter: blur(8px);
    opacity: 0.2;
    pointer-events: none;
}

/* 🌀 NAČÍTACÍ SPINNER OVERLAY */
.loader-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 10;
}

.login.is-loading .loader-overlay {
    opacity: 1;
    pointer-events: auto;
}

.spinner {
    width: 42px;
    height: 42px;
    border: 3px solid rgba(255, 255, 255, 0.18);
    border-top-color: #08ac26; /* Zelený akcent dle tlačítka */
    border-radius: 50%;
    animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
}

.loader-text {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 0.5px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.login::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background:
        radial-gradient(
            120px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
            rgba(255,255,255,0.9),
            rgba(255,255,255,0.25) 22%,
            transparent 55%
        );
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease, background-position 0.04s linear;
}

.login:hover::after {
    opacity: 1;
}

.login img {
    width: 160px;
    margin-bottom: 10px;
}

.login p {
    margin: 0 0 30px;
    opacity: 0.8;
}

input[type="email"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 15px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.18);
    color: white;
    outline: none;
    font-size: 14px;
    backdrop-filter: blur(10px);
}

input::placeholder {
    color: rgba(255,255,255,0.75);
}

/* 🚀 NOVÉ: Stylování políčka pro trvalé přihlášení */
.remember-me-container {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: -4px 0 24px 6px;
    cursor: pointer;
    user-select: none;
    text-align: left;
    position: relative;
}

/* Schováme původní ošklivý checkbox */
.remember-me-container input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
    height: 0;
    width: 0;
}

/* Vlastní zaoblený rámeček checkboxu */
.custom-checkbox {
    position: relative;
    width: 20px;
    height: 20px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 6px; /* Zaoblení */
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Text vedle checkboxu */
.remember-me-container span {
    font-size: 13px;
    opacity: 0.8;
    transition: opacity 0.2s ease;
}

/* Hover efekt na celý kontejner */
.remember-me-container:hover .custom-checkbox {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.45);
}

.remember-me-container:hover span {
    opacity: 1;
}

/* Styl, když je checkbox ZAŠKRTNUTÝ */
.remember-me-container input:checked ~ .custom-checkbox {
    background: rgba(8, 172, 38, 0.85);
    border-color: rgba(8, 172, 38, 1);
    box-shadow: 0 0 12px rgba(8, 172, 38, 0.5);
}

/* Vnitřní fajfka (skrytá v základu) */
.custom-checkbox::after {
    content: "";
    position: absolute;
    display: none;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    margin-top: -2px;
}

/* Zobrazení fajfky při zaškrtnutí */
.remember-me-container input:checked ~ .custom-checkbox::after {
    display: block;
}

/* 🌀 MOTION BLUR / GLOW EFEKT PŘI KLIKNUTÍ */
.custom-checkbox::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 10px;
    background: rgba(8, 172, 38, 0.6);
    opacity: 0;
    transform: scale(0.6);
    transition: all 0.4s cubic-bezier(0.1, 0.8, 0.3, 1);
    filter: blur(4px); /* Motion blur efekt */
    pointer-events: none;
}

/* Aktivace rozostřeného pulsu v momentě kliknutí */
.remember-me-container input:active ~ .custom-checkbox::before {
    opacity: 1;
    transform: scale(1.4);
    filter: blur(8px);
    transition: 0s; /* Okamžitý záblesk při stisku, plynulé odeznění při puštění */
}

.button:hover { background: #c9c3ba; }
.button:active { transform: scale(0.97); }

button {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(8, 172, 38, 0.85);
    color: white;
    font-size: 15px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: transform 0.16s ease, background 0.16s ease;
}

button:hover {
    background: rgba(0, 131, 24, 0.9);
    transform: scale(0.98);
}

button:active { transform: scale(0.94); }

.error {
    margin-top: 15px;
    color: #ffb3b3;
    font-size: 14px;
}

.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 16px;
    color: white;
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.12);
    transition: transform 0.16s ease, background 0.16s ease, opacity 0.16s ease;
}

.back-btn:hover {
    opacity: 1;
    background: rgba(255,255,255,0.12);
    transform: scale(0.96);
}

.back-btn:active { transform: scale(0.9); }

.login-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 14px;
}

.login-divider span {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.35);
}

.login-divider p { margin: 0; font-size: 12px; opacity: 0.75; }

.google-btn {
    background: rgba(220, 220, 220, 0.72);
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(12px);
    transition: transform 0.16s ease, background 0.16s ease;
}

.google-btn:hover {
    background: rgba(235, 235, 235, 0.82);
    transform: scale(0.98);
}

.google-btn:active { transform: scale(0.94); }

.google-btn img {
    width: 18px;
    height: 18px;
    position: relative;
    top: 5px;
}

/* ===== MOBILNÍ ZOBRAZENÍ ===== */
@media (max-width: 600px) {
    body {
        min-height: 100vh;
        height: auto;
        padding: 90px 18px 30px 18px;
        align-items: flex-start;
        background-position: center;
    }
    .login { width: 100%; max-width: 360px; margin: 0 auto; }
    .login img { width: 135px; }
    .login p { font-size: 14px; margin-bottom: 24px; }
    input[type="email"], input[type="password"] { font-size: 16px; padding: 13px 14px; }
    button { font-size: 15px; padding: 13px; }
    .google-btn { gap: 10px; font-size: 14px; }
    .google-btn img { width: 18px; height: 18px; top: -1px; }
    .back-btn { top: 16px; left: 16px; padding: 9px 14px; font-size: 13px; border-radius: 14px; }
    .error { font-size: 13px; line-height: 1.4; }
}

@media (max-width: 380px) {
    body { padding-left: 14px; padding-right: 14px; }
    .login img { width: 120px; }
    .google-btn { font-size: 13px; }
}
</style>
</head>

<body>

<a href="https://alces-as.fun" class="back-btn">← Zpět</a>

<div class="login is-loading" id="loginBox">
    <!-- 🌀 SPINNER KDYŽ PROBÍHÁ NAČÍTÁNÍ -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">Načítám...</div>
    </div>

    <!-- 🔒 HLAVNÍ OBSAH KTERÝ SE PŘI NAČÍTÁNÍ ROZMAŽE -->
    <div class="login-content">
        <img src="logo.png" alt="alces">
        <p>Interní systém společnosti</p>

        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="password" placeholder="Heslo">

        <label class="remember-me-container">
            <input type="checkbox" id="rememberMe" checked>
            <div class="custom-checkbox"></div>
            <span>Zůstat přihlášen(a)</span>
        </label>

        <button id="loginBtn">Přihlásit se</button>
        
        <div class="login-divider">
            <span></span>
            <p>nebo</p>
            <span></span>
        </div>

        <button id="googleBtn" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Přihlásit se přes Google
        </button>

        <div class="error" id="error"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";

import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAwRV2OuIhA-oyg295gIv5-4zfzO4qb9MY",
    authDomain: "alces-d505c.firebaseapp.com",
    projectId: "alces-d505c",
    storageBucket: "alces-d505c.firebasestorage.app",
    messagingSenderId: "318520073072",
    appId: "1:318520073072:web:53ab5c0033f60e96bbcdb5",
    measurementId: "G-V47V01CEZM"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const rememberMeInput = document.getElementById("rememberMe");
const errorBox = document.getElementById("error");

const loginBox = document.getElementById("loginBox");
const loaderText = document.getElementById("loaderText");

function startLoading(text = "Ověřuji...") {
    loaderText.innerText = text;
    loginBox.classList.add("is-loading");
}

function stopLoading() {
    loginBox.classList.remove("is-loading");
}

document.getElementById("loginBtn").addEventListener("click", loginWithEmail);
document.getElementById("googleBtn").addEventListener("click", loginWithGoogle);

// Sledování stavu přihlášení
onAuthStateChanged(auth, async (user) => {
    if (user) {
        startLoading("Načítám profil...");
        await loadUserData(user);
    } else {
        stopLoading();
    }
});

async function loginWithEmail() {
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    errorBox.innerText = "";
    startLoading("Přihlašuji...");

    try {
        const persistenceType = rememberMeInput.checked ? browserLocalPersistence : browserSessionPersistence;
        await setPersistence(auth, persistenceType);

        await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
        console.error(error);
        stopLoading();
        errorBox.innerText = error.code + " | " + error.message;
    }
}

async function loginWithGoogle() {
    errorBox.innerText = "";
    startLoading("Připojuji ke Google...");

    try {
        const persistenceType = rememberMeInput.checked ? browserLocalPersistence : browserSessionPersistence;
        await setPersistence(auth, persistenceType);

        await signInWithPopup(auth, provider);
    } catch (error) {
        console.error(error);
        stopLoading();
        errorBox.innerText = error.code + " | " + error.message;
    }
}

async function loadUserData(firebaseUser) {
    const email = firebaseUser.email.toLowerCase();

    try {
        const userDocRef = doc(db, "users", email);
        const userDoc = await getDoc(userDocRef);

        if (!userDoc.exists()) {
            await signOut(auth);
            stopLoading();
            errorBox.innerText = "Tento účet postrádá potřebná oprávnění pro vstup do systému.";
            return;
        }

        const data = userDoc.data();

        localStorage.setItem("username", data.name);
        localStorage.setItem("rank", data.rank);
        localStorage.setItem("rankName", data.rankName);
        localStorage.setItem("email", email);
        localStorage.setItem("uid", firebaseUser.uid);
        localStorage.setItem("mentorId", data.mentorId || "");

        window.location.href = "home.html";
    } catch (err) {
        console.error(err);
        stopLoading();
        errorBox.innerText = "Chyba při načítání dat: " + err.message;
    }
}

const login = document.querySelector(".login");

login.addEventListener("mousemove", (e) => {
    const rect = login.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    login.style.setProperty("--mouse-x", `${x}px`);
    login.style.setProperty("--mouse-y", `${y}px`);
});

function upravFaviconuPodleRezimu() {
    const favicon = document.getElementById('favicon');
    if (!favicon) return;
    const jeTemnyRezim = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (jeTemnyRezim) {
        favicon.href = 'fotky/univ/favicon.png'; 
    } else {
        favicon.href = 'fotky/univ/favicon-cerna.png';
    }
}

upravFaviconuPodleRezimu();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', upravFaviconuPodleRezimu);
</script>

</body>
</html>
